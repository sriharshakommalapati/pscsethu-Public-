name: Daily Deploy to PSCsethu.com & GoDaddy Link

on:
  schedule:
    # Runs daily at 00:30 UTC (06:00 AM IST) for syllabus & content updates
    - cron: '30 0 * * *'
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      target_domain:
        description: 'Target Deployment Domain (Must be www.pscsethu.com)'
        required: true
        default: 'www.pscsethu.com'

# Explicit Security & Deployment Guard:
# DEPLOY ONLY TO PSCSETHU.COM - STRICTLY PROHIBIT pscsethu.in
env:
  ALLOWED_DOMAIN: 'www.pscsethu.com'
  FORBIDDEN_DOMAIN: 'www.pscsethu.in'
  NODE_VERSION: '22.x'

jobs:
  validate-and-deploy:
    name: Build, Link GoDaddy DNS & Deploy Daily to www.pscsethu.com
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Verify Strict Domain Routing Policy
        run: |
          echo "=========================================================="
          echo "Verifying Deployment Target Policy..."
          TARGET="${{ github.event.inputs.target_domain || env.ALLOWED_DOMAIN }}"
          echo "Target Domain: $TARGET"
          
          # STRICT BLOCKER: Fail immediately if pscsethu.in is targeted
          if [[ "$TARGET" == *"${{ env.FORBIDDEN_DOMAIN }}"* ]] || [[ "$TARGET" == *"pscsethu.in"* ]]; then
            echo "❌ CRITICAL ERROR: Deployment to $TARGET is strictly disallowed."
            echo "Policy Rule: Do not deploy to www.pscsethu.in. Deploy ONLY to www.pscsethu.com."
            exit 1
          fi
          
          if [[ "$TARGET" != *"${{ env.ALLOWED_DOMAIN }}"* ]] && [[ "$TARGET" != *"pscsethu.com"* ]]; then
            echo "❌ ERROR: Unauthorized target domain '$TARGET'. Deployments are restricted exclusively to www.pscsethu.com."
            exit 1
          fi

          echo "✅ Target verified: Deployment authorized solely for www.pscsethu.com"
          echo "=========================================================="

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Code Quality & Type Checks
        run: npm run lint

      - name: Build Production Assets for www.pscsethu.com
        run: |
          npm run build
          # Ensure canonical CNAME exists in dist
          echo "www.pscsethu.com" > dist/CNAME
          # Disable Jekyll so Vite assets are served directly
          touch dist/.nojekyll
          # Ensure ads.txt is present for Google AdSense monetization
          cp public/ads.txt dist/ads.txt || true

      - name: Verify Distribution Artifacts & Google Ads File
        run: |
          if [ ! -f dist/index.html ]; then
            echo "❌ ERROR: dist/index.html not found! Build failed."
            exit 1
          fi
          if [ ! -f dist/ads.txt ]; then
            echo "⚠️ Warning: dist/ads.txt missing, re-creating..."
            echo "google.com, pub-9463525929730000, DIRECT, f08c47fec0942fa0" > dist/ads.txt
          fi
          echo "✅ Production artifacts verified for www.pscsethu.com:"
          ls -lah dist/

      - name: Link & Synchronize GoDaddy DNS
        env:
          GODADDY_PAT: ${{ secrets.GODADDY_PAT || 'gd_pat_Linut8JGqWaVVlAwSAVKNzBdB0dqbCFWisBPrqQxC5g_5996d4e9' }}
        run: |
          echo "🔗 Verifying & updating GoDaddy DNS records for pscsethu.com..."
          bash scripts/sync-godaddy-dns.sh

      - name: Deploy to GitHub Pages (www.pscsethu.com)
        uses: peaceiris/actions-gh-pages@v4
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          cname: www.pscsethu.com
          commit_message: "Automated daily deployment to www.pscsethu.com [skip ci]"

      - name: Notify Deployment Success
        if: success()
        run: |
          echo "=========================================================="
          echo "🎉 Daily deployment to www.pscsethu.com completed successfully!"
          echo "🌐 URL: https://www.pscsethu.com"
          echo "💰 Google AdSense: pub-9463525929730000 active"
          echo "⏱️ Time: $(date -u)"
          echo "=========================================================="
